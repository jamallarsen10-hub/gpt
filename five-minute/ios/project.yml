name: FiveMinute
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FiveMinute:
    type: application
    platform: iOS
    sources:
      - path: FiveMinute
        excludes: [Info.plist, FiveMinute.entitlements]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FM_BUNDLE_PREFIX).Focus
        INFOPLIST_FILE: FiveMinute/Info.plist
        CODE_SIGN_ENTITLEMENTS: FiveMinute/FiveMinute.entitlements
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: Monitor
        embed: true
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
  Monitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Monitor
        excludes: [Info.plist, Monitor.entitlements]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FM_BUNDLE_PREFIX).Focus.Monitor
        INFOPLIST_FILE: Monitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Monitor/Monitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
schemes:
  FiveMinute:
    build:
      targets:
        FiveMinute: all
    run:
      config: Debug
    archive:
      config: Release
